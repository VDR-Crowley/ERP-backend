        - total
        - payment_pending
        - buyer
        - seller_id
        - delivery_pending
        - stock_location_type
      properties:
        date:
          type: string
          format: date
          example: "2026-08-20"
        product_id:
          type: integer
          description: Deve existir em `products`
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 5
        unit_price:
          type: number
          format: float
          minimum: 0
          example: 12.5
        total:
          type: number
          format: float
          minimum: 0
          example: 62.5
        payment_pending:
          type: boolean
          example: false
        buyer:
          type: string
          maxLength: 255
          example: Maria Compradora
        seller_id:
          type: integer
          description: Deve existir em `vendedores`
          example: 1
        delivery_pending:
          type: boolean
          example: false
        delivery_date:
          type: string
          format: date
          nullable: true
        stock_location_type:
          type: string
          enum: [plantel, vendedor]
          description: Local de onde o estoque é baixado
          example: plantel
        stock_location_vendedor_id:
          type: integer
          nullable: true
          description: >
            Obrigatório e deve existir em `vendedores` quando
            `stock_location_type=vendedor`; proibido (deve vir ausente/null)
            quando `stock_location_type=plantel`.
          example: null

