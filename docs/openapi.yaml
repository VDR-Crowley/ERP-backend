openapi: 3.0.3
info:
  title: MiniERP API
  description: >
    Backend MiniERP: autenticação (login, cadastro, reset de senha, refresh
    token) via Sanctum, mais as 17 entidades core (produtos, vendedores,
    plantel, incubação, estoques, vendas, transferências, produção diária,
    despesas, fluxo de caixa, ração, limpeza) e o relatório de Análise por
    Linha de Negócio. Sanctum com par de tokens: access token (2h) + refresh
    token (30 dias, rotação a cada uso). Sem sessão/cookie — só Bearer token.
  version: "1.1.0"
servers:
  - url: http://localhost:8000/api
    description: Dev local

tags:
  - name: Auth
    description: Registro, login, logout e refresh de token
  - name: Password Reset
    description: Fluxo de redefinição de senha por código de 6 dígitos
  - name: Users
    description: >
      Administração de usuários pela tela de admin (diferente do cadastro
      público `/register`) — "excluir" desativa, não apaga de verdade
  - name: Products
    description: Catálogo de produtos vendidos (ovos, embalagens etc.)
  - name: Vendedores
    description: Cadastro de vendedores/revendedores
  - name: Flock
    description: Plantel (lotes de aves em produção) — codorna/quail e galinha/chicken
  - name: FlockIncubation
    description: Lotes em incubação e os eventos de nascimento (hatch events)
  - name: VendorStock
    description: Estoque de produtos alocado por vendedor
  - name: Sales
    description: Vendas — baixam estoque automaticamente no local informado
  - name: StockTransfers
    description: Transferências de estoque entre Plantel e vendedores
  - name: DailyProductions
    description: Produção diária de ovos por espécie
  - name: EggStocks
    description: Estoque diário de ovos (unidades, bandejas e valor)
  - name: Expenses
    description: Despesas, com rateio por espécie via override manual
  - name: CashFlows
    description: Fluxo de caixa (entradas e saídas)
  - name: FeedStocks
    description: Estoque de ração — reposição e abertura de saco
  - name: FeedOpenLogs
    description: Histórico (somente leitura) de sacos de ração abertos
  - name: FlockCleanings
    description: Registros de limpeza do plantel
  - name: BusinessLineReport
    description: Relatório de Análise por Linha de Negócio (codorna x galinha)

paths:
  /register:
    post:
      tags: [Auth]
      summary: Cadastrar novo usuário
      description: >
        Cria o usuário (role default `ADMINISTRADOR`) e já devolve um par de
        tokens — login automático, sem etapa de confirmação de e-mail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuário criado e autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          description: Erro de validação (e-mail já cadastrado, senha não confere, campos obrigatórios)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                emailDuplicado:
                  value:
                    message: "The email has already been taken."
                    errors:
                      email: ["The email has already been taken."]

  /login:
    post:
      tags: [Auth]
      summary: Autenticar com e-mail e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          description: Credenciais inválidas (mensagem genérica — não revela se o e-mail existe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                credenciaisInvalidas:
                  value:
                    message: "E-mail ou senha inválidos."
                    errors:
                      email: ["E-mail ou senha inválidos."]
        '429':
          description: Rate limit excedido (throttle de login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /logout:
    post:
      tags: [Auth]
      summary: Encerrar a sessão atual
      description: Revoga o par de tokens (access + refresh) da sessão do token usado na chamada.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sessão encerrada, sem conteúdo de resposta
        '401':
          description: Token ausente, inválido, expirado ou já revogado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Token autenticado mas sem ability `access` (ex., um refresh token usado aqui)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user:
    get:
      tags: [Auth]
      summary: Dados do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Token autenticado mas sem ability `access`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    get:
      tags: [Users]
      summary: Listar usuários
      description: Não paginado, mesmo padrão das outras entidades core.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Users]
      summary: Criar usuário
      description: >
        Fluxo de admin (diferente do cadastro público `/register`) — role
        sempre `ADMINISTRADOR`, não é campo aceito no payload.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUserRequest'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{user}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Users]
      summary: Atualizar usuário
      description: >
        Senha opcional (só troca se enviada). `is_active` incluso — desativar
        a própria conta é bloqueado (422).
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Erro de validação, incluindo tentativa de desativar a própria conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    patch:
      tags: [Users]
      summary: Atualizar usuário (parcial)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Desativar usuário
      description: >
        Não apaga de verdade — só marca `is_active=false`. Desativar a
        própria conta é bloqueado (422).
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Usuário desativado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Tentativa de desativar a própria conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /refresh:
    post:
      tags: [Auth]
      summary: Rotacionar o par de tokens
      description: >
        Aceita só token com ability `refresh` (enviar o `refresh_token` no
        header Authorization). Revoga o par atual e emite um par novo —
        rotação, o refresh token usado nunca pode ser reaproveitado.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Par de tokens novo emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Refresh token ausente, inválido, expirado ou já usado/revogado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Token autenticado mas sem ability `refresh` (ex., um access token usado aqui)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /password/forgot:
    post:
      tags: [Password Reset]
      summary: Solicitar código de redefinição de senha
      description: >
        Sempre responde 200 com mensagem genérica, exista ou não o e-mail
        (evita user enumeration). Se existir, envia um código de 6 dígitos
        por e-mail (válido por 15 minutos).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: usuario@exemplo.com
      responses:
        '200':
          description: Solicitação processada (genérico, não revela se o e-mail existe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                default:
                  value:
                    message: "Se o e-mail existir, enviamos um código de redefinição."
        '422':
          description: E-mail ausente ou em formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Rate limit excedido (throttle de reset de senha)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /password/verify-code:
    post:
      tags: [Password Reset]
      summary: Validar o código de 6 dígitos (sem consumir)
      description: >
        Confere e-mail + código sem invalidar o registro — usado no
        passo 2→3 do wizard, antes do usuário digitar a nova senha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        '200':
          description: Código válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Código inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                codigoInvalido:
                  value:
                    message: "Código inválido ou expirado."
                    errors:
                      code: ["Código inválido ou expirado."]
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /password/reset:
    post:
      tags: [Password Reset]
      summary: Confirmar redefinição de senha
      description: >
        Confere e-mail + código de novo, troca a senha, consome o código e
        revoga TODAS as sessões (todos os pares access+refresh, todos os
        dispositivos) do usuário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Senha redefinida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                default:
                  value:
                    message: "Senha redefinida com sucesso."
        '422':
          description: Código inválido/expirado, ou senha/confirmação inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # Products
  # ============================================================
  /products:
    get:
      tags: [Products]
      summary: Listar produtos
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Products]
      summary: Criar produto
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Erro de validação (ex. `name` duplicado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /products/{product}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Detalhar produto
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Atualizar produto
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Products]
      summary: Excluir produto
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Produto excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Vendedores
  # ============================================================
  /vendedores:
    get:
      tags: [Vendedores]
      summary: Listar vendedores
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de vendedores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vendedor'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Vendedores]
      summary: Criar vendedor
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendedorRequest'
      responses:
        '201':
          description: Vendedor criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /vendedores/{vendedor}:
    parameters:
      - $ref: '#/components/parameters/VendedorId'
    get:
      tags: [Vendedores]
      summary: Detalhar vendedor
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Vendedor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Vendedores]
      summary: Atualizar vendedor
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendedorRequest'
      responses:
        '200':
          description: Vendedor atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendedor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Vendedores]
      summary: Excluir vendedor
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Vendedor excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Flock (plantel)
  # ============================================================
  /flock:
    get:
      tags: [Flock]
      summary: Listar lotes do plantel
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de lotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flock'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Flock]
      summary: Criar lote do plantel
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlockRequest'
      responses:
        '201':
          description: Lote criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /flock/{flock}:
    parameters:
      - $ref: '#/components/parameters/FlockId'
    get:
      tags: [Flock]
      summary: Detalhar lote do plantel
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Flock]
      summary: Atualizar lote do plantel
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlockRequest'
      responses:
        '200':
          description: Lote atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Flock]
      summary: Excluir lote do plantel
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Lote excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # FlockIncubation + hatch events
  # ============================================================
  /flock-incubations:
    get:
      tags: [FlockIncubation]
      summary: Listar lotes em incubação
      description: Cada lote vem com seus `hatch_events` carregados.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de lotes em incubação
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlockIncubation'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [FlockIncubation]
      summary: Criar lote em incubação
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreFlockIncubationRequest'
      responses:
        '201':
          description: Lote em incubação criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlockIncubation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /flock-incubations/{flock_incubation}:
    parameters:
      - $ref: '#/components/parameters/FlockIncubationId'
    get:
      tags: [FlockIncubation]
      summary: Detalhar lote em incubação
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lote em incubação (com `hatch_events`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlockIncubation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [FlockIncubation]
      summary: Atualizar lote em incubação
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFlockIncubationRequest'
      responses:
        '200':
          description: Lote atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlockIncubation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [FlockIncubation]
      summary: Excluir lote em incubação
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Lote excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /flock-incubations/{flock_incubation}/hatch-events:
    parameters:
      - $ref: '#/components/parameters/FlockIncubationId'
    get:
      tags: [FlockIncubation]
      summary: Listar eventos de nascimento do lote
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de eventos de nascimento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HatchEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [FlockIncubation]
      summary: Registrar evento de nascimento
      description: >
        Cria o evento e recalcula o status do lote: se a soma de `count` de
        todos os `hatch_events` atingir `egg_count`, o lote é fechado
        automaticamente (`status` vira `eclodido`).
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HatchEventRequest'
      responses:
        '201':
          description: Evento criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HatchEvent'
