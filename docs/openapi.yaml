  # ============================================================
  # Sales
  # ============================================================
  /sales:
    get:
      tags: [Sales]
      summary: Listar vendas
      description: Cada venda vem com a `exclusion` carregada (se marcada como evento isolado).
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de vendas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sale'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Sales]
      summary: Registrar venda
      description: >
        Cria a venda e baixa o estoque do produto no local informado
        (`stock_location_type`/`stock_location_vendedor_id`: Plantel ou um
        vendedor específico). Não bloqueia estoque negativo — mesmo
        comportamento lenient do front.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleRequest'
      responses:
        '201':
          description: Venda criada (estoque já baixado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: >
            Erro de validação — inclui `stock_location_vendedor_id`
            obrigatório quando `stock_location_type=vendedor` (e proibido
            quando `stock_location_type=plantel`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /sales/{sale}:
    parameters:
      - $ref: '#/components/parameters/SaleId'
    get:
      tags: [Sales]
      summary: Detalhar venda
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Venda (com `exclusion`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Sales]
      summary: Atualizar venda
      description: >
        Desfaz a baixa de estoque antiga e aplica a nova — mesmo se produto,
        local ou quantidade mudaram.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleRequest'
      responses:
        '200':
          description: Venda atualizada (estoque reajustado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Sales]
      summary: Excluir venda
      description: Devolve ao local de origem a quantidade que havia sido baixada por essa venda.
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Venda excluída (estoque devolvido)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /sales/{sale}/exclusion:
    parameters:
      - $ref: '#/components/parameters/SaleId'
    post:
      tags: [Sales]
      summary: Marcar venda como evento isolado
      description: >
        Marca a venda como "evento isolado" — fica de fora da Análise por
        Linha de Negócio. Idempotente: chamar de novo atualiza o `reason`
        (`updateOrCreate`).
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleExclusionRequest'
      responses:
        '201':
          description: Venda marcada como evento isolado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleExclusion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Sales]
      summary: Desmarcar venda como evento isolado
      description: Remove a exclusão — a venda volta a entrar na Análise por Linha de Negócio.
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Exclusão removida
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # StockTransfers
  # ============================================================
  /stock-transfers:
    get:
      tags: [StockTransfers]
      summary: Listar transferências de estoque
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de transferências
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockTransfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [StockTransfers]
      summary: Criar transferência de estoque
      description: >
        Move a quantidade do local de origem pro de destino. Diferente da
        venda, aqui é exigido saldo suficiente no local de origem — decisão
        de endurecer a regra no backend (o front é lenient e nunca bloqueia
        estoque negativo).
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockTransferRequest'
      responses:
        '201':
          description: Transferência criada (estoque movido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTransfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: >
            Erro de validação — inclui **saldo insuficiente** no local de
            origem (`quantity`: "Saldo insuficiente no local de origem
            (disponível: N).") e **origem igual ao destino**
            (`to_location_type`: "O destino da transferência não pode ser
            igual à origem.")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                saldoInsuficiente:
                  value:
                    message: "The given data was invalid."
                    errors:
                      quantity: ["Saldo insuficiente no local de origem (disponível: 3)."]
                origemIgualDestino:
                  value:
                    message: "The given data was invalid."
                    errors:
                      to_location_type: ["O destino da transferência não pode ser igual à origem."]

  /stock-transfers/{stock_transfer}:
    parameters:
      - $ref: '#/components/parameters/StockTransferId'
    get:
      tags: [StockTransfers]
      summary: Detalhar transferência de estoque
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Transferência
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTransfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [StockTransfers]
      summary: Atualizar transferência de estoque
      description: Desfaz o movimento antigo antes de validar saldo e aplicar o novo.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockTransferRequest'
      responses:
        '200':
          description: Transferência atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTransfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Mesmas regras de negócio do create (saldo insuficiente / origem igual ao destino)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    delete:
      tags: [StockTransfers]
      summary: Excluir transferência de estoque
      description: Reverte o movimento — devolve a quantidade à origem e retira do destino.
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Transferência excluída (estoque revertido)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

