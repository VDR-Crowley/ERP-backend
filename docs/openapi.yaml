        cost:
          type: number
          format: float
          example: 3100.0
        profit:
          type: number
          format: float
          example: 2100.0
        margin_pct:
          type: number
          format: float
          description: "`0` quando `revenue` é 0"
          example: 40.38

    BusinessLineReportProductEntry:
      type: object
      description: Ordenado por `margin_pct` (pior primeiro)
      properties:
        name:
          type: string
          example: Bandeja de ovos de codorna
        revenue:
          type: number
          format: float
          example: 3200.0
        cost:
          type: number
          format: float
          example: 1900.0
        profit:
          type: number
          format: float
          example: 1300.0
        margin_pct:
          type: number
          format: float
          example: 40.62
        quantity_sold:
          type: integer
          example: 64

    BusinessLineReportMonthlyEntry:
      type: object
      description: Só meses com venda real aparecem
      properties:
        month:
          type: string
          description: "Formato `YYYY-MM`"
          example: "2026-08"
        quail_revenue:
          type: number
          format: float
          example: 3200.0
        chicken_revenue:
          type: number
          format: float
          example: 2000.0

    BusinessLineReport:
      type: object
      properties:
        by_species:
          type: object
          properties:
            quail:
              $ref: '#/components/schemas/SpeciesTotals'
            chicken:
              $ref: '#/components/schemas/SpeciesTotals'
            chicken_covers_costs:
              type: boolean
              description: "`true` quando o lucro da galinha (`chicken.profit`) é >= 0"
              example: true
            difference_covered_by_quail:
              type: number
              format: float
              description: "`0` quando `chicken_covers_costs` é `true`; senão, o valor absoluto do prejuízo da galinha"
              example: 0.0
        by_product:
          type: array
          items:
            $ref: '#/components/schemas/BusinessLineReportProductEntry'
        monthly_series:
          type: array
          items:
            $ref: '#/components/schemas/BusinessLineReportMonthlyEntry'
