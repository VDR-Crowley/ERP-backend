          type: integer
          example: 1
        date:
          type: string
          format: date
        product_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 5
        unit_price:
          type: string
          description: Decimal (2 casas), serializado como string
          example: "12.50"
        total:
          type: string
          description: Decimal (2 casas), serializado como string
          example: "62.50"
        payment_pending:
          type: boolean
        buyer:
          type: string
          example: Maria Compradora
        seller_id:
          type: integer
          example: 1
        delivery_pending:
          type: boolean
        delivery_date:
          type: string
          format: date
          nullable: true
        stock_location_type:
          type: string
