          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [CashFlows]
      summary: Excluir lançamento de caixa
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Lançamento excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # FeedStocks
  # ============================================================
  /feed-stocks:
    get:
      tags: [FeedStocks]
      summary: Listar estoque de ração
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de tipos de ração em estoque
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedStock'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [FeedStocks]
      summary: Criar tipo de ração em estoque
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedStockRequest'
      responses:
        '201':
          description: Registro criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedStock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Erro de validação (ex. `type` duplicado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /feed-stocks/{feed_stock}:
    parameters:
      - $ref: '#/components/parameters/FeedStockId'
    get:
      tags: [FeedStocks]
      summary: Detalhar tipo de ração em estoque
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Registro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedStock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [FeedStocks]
      summary: Atualizar tipo de ração em estoque
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedStockRequest'
      responses:
        '200':
          description: Registro atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedStock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [FeedStocks]
      summary: Excluir tipo de ração em estoque
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Registro excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /feed-stocks/{feed_stock}/replenish:
    parameters:
      - $ref: '#/components/parameters/FeedStockId'
    post:
      tags: [FeedStocks]
      summary: Repor estoque de ração
      description: >
        Soma `bags`/`bags * bag_weight_kg` ao saldo (`bags_in_stock`/
        `kg_in_stock`) e troca `last_bag_weight_kg`/`expiration_date` pros
        valores da remessa reposta.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplenishFeedStockRequest'
      responses:
        '200':
          description: Estoque reposto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedStock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /feed-stocks/{feed_stock}/open-bag:
    parameters:
      - $ref: '#/components/parameters/FeedStockId'
    post:
      tags: [FeedStocks]
      summary: Abrir saco de ração
      description: >
        Decrementa 1 saco e `weight_kg` do saldo (`bags_in_stock`/
        `kg_in_stock`; não altera `last_bag_weight_kg`) e registra o
        `feed_open_logs` correspondente.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenFeedStockBagRequest'
      responses:
        '200':
          description: Saco aberto (estoque decrementado e log registrado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedStock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ============================================================
  # FeedOpenLogs (somente leitura)
  # ============================================================
  /feed-open-logs:
    get:
      tags: [FeedOpenLogs]
      summary: Listar histórico de sacos abertos
      description: Somente leitura — o log é criado via `POST /feed-stocks/{feed_stock}/open-bag`.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de logs de abertura de saco
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedOpenLog'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # FlockCleanings
  # ============================================================
  /flock-cleanings:
    get:
      tags: [FlockCleanings]
      summary: Listar limpezas do plantel
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Lista de registros de limpeza
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlockCleaning'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [FlockCleanings]
      summary: Registrar limpeza do plantel
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlockCleaningRequest'
      responses:
        '201':
          description: Registro criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlockCleaning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /flock-cleanings/{flock_cleaning}:
    parameters:
      - $ref: '#/components/parameters/FlockCleaningId'
    get:
      tags: [FlockCleanings]
      summary: Detalhar registro de limpeza
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Registro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlockCleaning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [FlockCleanings]
      summary: Atualizar registro de limpeza
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlockCleaningRequest'
      responses:
        '200':
          description: Registro atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlockCleaning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [FlockCleanings]
      summary: Excluir registro de limpeza
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Registro excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # BusinessLineReport
  # ============================================================
  /business-line-report:
    get:
      tags: [BusinessLineReport]
      summary: Relatório de Análise por Linha de Negócio
      description: >
        Compara codorna/quail x galinha/chicken (receita, custo, lucro,
        margem), montado a partir de `sales` (excluindo as marcadas em
        `sale_exclusions`), `expenses` (respeitando
        `expense_species_overrides`), `flock` e `products`. Período opcional
        via `start`/`end` — sem os dois, considera todo o histórico.
      security: [{bearerAuth: []}]
      parameters:
        - name: start
          in: query
          required: false
          description: Data inicial do período (inclusive)
          schema:
            type: string
            format: date
            example: "2026-01-01"
        - name: end
          in: query
          required: false
          description: Data final do período (inclusive). Deve ser >= `start`.
          schema:
            type: string
            format: date
            example: "2026-08-31"
      responses:
        '200':
          description: Relatório montado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessLineReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: "`end` anterior a `start`, ou datas em formato inválido"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "Sanctum personal access token — formato \"{id}|{texto-do-token}\". Enviar o access_token nas rotas normais e o refresh_token só em /refresh."
      description: >
        Todas as rotas protegidas exigem header `Authorization: Bearer <token>`.
        O token deve ter a ability certa pra rota: `access` para as rotas
        normais da API (todas as rotas de entidades, /user, /logout), `refresh`
        só para /refresh. Usar o token errado (ex. refresh token numa rota
        normal) resulta em 403.

  parameters:
    UserId:
      name: user
      in: path
      required: true
      schema:
        type: integer
      example: 1
    ProductId:
      name: product
      in: path
      required: true
      schema:
        type: integer
      example: 1
    VendedorId:
      name: vendedor
      in: path
      required: true
      schema:
        type: integer
      example: 1
    FlockId:
      name: flock
      in: path
      required: true
      schema:
        type: integer
      example: 1
    FlockIncubationId:
      name: flock_incubation
      in: path
      required: true
      schema:
        type: integer
      example: 1
    HatchEventId:
      name: hatch_event
      in: path
      required: true
      schema:
        type: integer
      example: 1
    VendorStockId:
      name: vendor_stock
      in: path
      required: true
      schema:
        type: integer
      example: 1
    SaleId:
      name: sale
      in: path
      required: true
      schema:
        type: integer
      example: 1
    StockTransferId:
      name: stock_transfer
      in: path
      required: true
      schema:
        type: integer
      example: 1
    DailyProductionId:
      name: daily_production
      in: path
      required: true
      schema:
        type: integer
      example: 1
    EggStockId:
      name: egg_stock
      in: path
      required: true
      schema:
        type: integer
      example: 1
    ExpenseId:
      name: expense
      in: path
      required: true
      schema:
        type: integer
      example: 1
    CashFlowId:
      name: cash_flow
      in: path
      required: true
      schema:
        type: integer
      example: 1
    FeedStockId:
      name: feed_stock
      in: path
      required: true
      schema:
        type: integer
      example: 1
    FlockCleaningId:
      name: flock_cleaning
      in: path
      required: true
      schema:
        type: integer
      example: 1

  responses:
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Erro de validação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
          example: Maria da Silva
        email:
          type: string
          format: email
          example: maria@exemplo.com
        password:
          type: string
          format: password
          minLength: 6
          example: minhasenha123
        password_confirmation:
          type: string
          format: password
          example: minhasenha123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: maria@exemplo.com
        password:
          type: string
          format: password
          example: minhasenha123

    VerifyCodeRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          example: maria@exemplo.com
        code:
          type: string
          description: Código numérico de 6 dígitos enviado por e-mail
          pattern: '^\d{6}$'
          example: "482913"

    ResetPasswordRequest:
      type: object
      required: [email, code, password, password_confirmation]
      properties:
        email:
          type: string
          format: email
          example: maria@exemplo.com
        code:
          type: string
          pattern: '^\d{6}$'
          example: "482913"
        password:
          type: string
          format: password
          minLength: 6
          example: novaSenha456
        password_confirmation:
          type: string
          format: password
          example: novaSenha456

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Maria da Silva
        email:
          type: string
          format: email
          example: maria@exemplo.com
        role:
          type: string
          example: ADMINISTRADOR
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2026-08-22T14:30:00.000000Z"

    StoreUserRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
          example: Maria da Silva
        email:
          type: string
          format: email
          example: maria@exemplo.com
        password:
          type: string
          format: password
          minLength: 6
          example: segredo6
        password_confirmation:
          type: string
          format: password
          example: segredo6

    UpdateUserRequest:
      type: object
      required: [name, email]
      description: >
        `password`/`password_confirmation` opcionais — senha só troca se
        enviada. `is_active=false` na própria conta logada retorna 422.
      properties:
        name:
          type: string
          maxLength: 255
          example: Maria da Silva
        email:
          type: string
          format: email
          example: maria@exemplo.com
        password:
          type: string
          format: password
          minLength: 6
        password_confirmation:
          type: string
          format: password
        is_active:
          type: boolean
          example: true

    AuthTokenResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          description: Token de acesso — usar nas rotas normais da API. Expira em 2 horas.
          example: "1|abcdEFGhijkLMNopqrsTUVwxyz0123456789ABCD"
        access_token_expires_at:
          type: string
          format: date-time
          example: "2026-08-22T16:30:00.000000Z"
        refresh_token:
          type: string
          description: Token de refresh — usar só em /refresh. Expira em 30 dias, rotacionado a cada uso.
          example: "2|zyxWVUtsrqpONMlkjIHGfedcba9876543210dcba"
        refresh_token_expires_at:
          type: string
          format: date-time
          example: "2026-09-21T14:30:00.000000Z"

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    # ------------------------------------------------------------
    # Products
    # ------------------------------------------------------------
    ProductRequest:
      type: object
      required: [name, unit, unit_price, stock, eggs_per_unit]
      properties:
        name:
          type: string
          maxLength: 255
          description: Único no cadastro (`unique:products,name`, ignorando o próprio registro no update)
          example: Bandeja de ovos de codorna
        unit:
          type: string
          maxLength: 255
          example: bandeja
        unit_price:
          type: number
          format: float
          minimum: 0
          example: 12.5
        stock:
          type: integer
          minimum: 0
          example: 100
        eggs_per_unit:
          type: integer
          minimum: 0
          example: 30

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Bandeja de ovos de codorna
        unit:
          type: string
          example: bandeja
        unit_price:
          type: string
          description: Decimal (2 casas), serializado como string pelo cast do Eloquent
          example: "12.50"
        stock:
          type: integer
          example: 100
        eggs_per_unit:
          type: integer
          example: 30
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ------------------------------------------------------------
    # Vendedores
    # ------------------------------------------------------------
    VendedorRequest:
      type: object
      required: [name, active]
      properties:
        name:
          type: string
          maxLength: 255
          example: João Distribuidor
        contact:
          type: string
          maxLength: 255
          nullable: true
          example: "(11) 99999-0000"
        active:
          type: boolean
          example: true

    Vendedor:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: João Distribuidor
        contact:
          type: string
          nullable: true
          example: "(11) 99999-0000"
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ------------------------------------------------------------
    # Flock
    # ------------------------------------------------------------
    FlockRequest:
      type: object
      required: [species, quantity, feed_bags_per_month, bag_price, monthly_total]
      properties:
        species:
          type: string
          maxLength: 255
          description: Texto livre (não restrito a `quail`/`chicken` como nas outras entidades)
          example: Codorna
        quantity:
          type: integer
          minimum: 0
          example: 500
        feed_bags_per_month:
          type: integer
          minimum: 0
          example: 10
        bag_price:
          type: number
          format: float
          minimum: 0
          example: 90.0
        monthly_total:
          type: number
          format: float
          minimum: 0
          example: 900.0

    Flock:
      type: object
      properties:
        id:
          type: integer
          example: 1
        species:
          type: string
          example: Codorna
        quantity:
          type: integer
          example: 500
        feed_bags_per_month:
          type: integer
          example: 10
        bag_price:
          type: string
          description: Decimal (2 casas), serializado como string
          example: "90.00"
        monthly_total:
          type: string
          description: Decimal (2 casas), serializado como string
          example: "900.00"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ------------------------------------------------------------
    # FlockIncubation + HatchEvent
    # ------------------------------------------------------------
    StoreFlockIncubationRequest:
      type: object
      required: [start_date, species, egg_count, expected_hatch_date]
      properties:
        start_date:
          type: string
          format: date
          example: "2026-08-01"
        species:
          type: string
          enum: [quail, chicken]
          example: quail
        egg_count:
          type: integer
          minimum: 1
          example: 50
        expected_hatch_date:
          type: string
          format: date
          example: "2026-08-19"
        status:
          type: string
          enum: [incubando, eclodido]
          description: Opcional na criação — assume o default da coluna quando omitido
          example: incubando
        egg_cost:
          type: number
          format: float
          minimum: 0
          nullable: true
          example: 25.0
        feed_cost:
          type: number
          format: float
          minimum: 0
          nullable: true
          example: 10.0
        notes:
          type: string
          nullable: true

    UpdateFlockIncubationRequest:
      allOf:
        - $ref: '#/components/schemas/StoreFlockIncubationRequest'
        - type: object
          required: [start_date, species, egg_count, expected_hatch_date, status]
          description: Igual ao create, mas `status` é obrigatório na atualização.

    FlockIncubation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        start_date:
          type: string
          format: date
        species:
          type: string
          enum: [quail, chicken]
        egg_count:
          type: integer
          example: 50
        expected_hatch_date:
          type: string
          format: date
        status:
          type: string
          enum: [incubando, eclodido]
        egg_cost:
          type: string
          nullable: true
          description: Decimal (2 casas), serializado como string
        feed_cost:
          type: string
          nullable: true
          description: Decimal (2 casas), serializado como string
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        hatch_events:
          type: array
          description: Carregado em index/show
          items:
            $ref: '#/components/schemas/HatchEvent'

    HatchEventRequest:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          format: date
          example: "2026-08-19"
        count:
          type: integer
          minimum: 1
          example: 45
        notes:
          type: string
          maxLength: 255
          nullable: true

    HatchEvent:
      type: object
      properties:
        id:
          type: integer
          example: 1
        flock_incubation_id:
          type: integer
          example: 1
        date:
          type: string
          format: date
        count:
          type: integer
          example: 45
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ------------------------------------------------------------
    # VendorStock
    # ------------------------------------------------------------
    VendorStockRequest:
      type: object
      required: [product_id, vendedor_id, quantity]
      properties:
        product_id:
          type: integer
          description: Deve existir em `products`
          example: 1
        vendedor_id:
          type: integer
          description: >
            Deve existir em `vendedores`. Par (`product_id`, `vendedor_id`)
            único — não pode haver dois registros de estoque do mesmo
            produto pro mesmo vendedor.
          example: 1
        quantity:
          type: integer
          minimum: 0
          example: 20

    VendorStock:
      type: object
      properties:
        id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        vendedor_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 20
